name: Exact backend diagnostics to persistent viewer contract
on:
  push:
    branches: [review/workspace-viewer-readiness-integration-20261103]
  pull_request:
    paths:
      - 'tests/contracts/**'
      - 'frontend/src/vnc/BackendWorkspaceContract.test.tsx'
      - '.github/workflows/workspace-backend-viewer-contract.yml'
permissions:
  contents: read
jobs:
  backend-to-viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12','3.13']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: zog144/station-access
          ref: c904108da7ac9fce4d7041d2781ef2f901a81b9c
          path: companions/station-readiness
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: zog144/box-control
          ref: 759085385f5a297c7e9f9f11bfbae487b146a600
          path: companions/box-control
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: zog144/root-control
          ref: dedf5d8f1b6c51aa81fe6ceb342a978f3af11566
          path: companions/root-control
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: zog144/zog
          ref: d47d86b363824c718d9c165124cb55bbed12e0f9
          path: companions/zog
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prove selected source revisions and non-shadowing fallback dependencies
        run: |
          test "$(git -C companions/station-readiness rev-parse HEAD)" = c904108da7ac9fce4d7041d2781ef2f901a81b9c
          test "$(git -C companions/box-control rev-parse HEAD)" = 759085385f5a297c7e9f9f11bfbae487b146a600
          test "$(git -C companions/root-control rev-parse HEAD)" = dedf5d8f1b6c51aa81fe6ceb342a978f3af11566
          test "$(git -C companions/zog rev-parse HEAD)" = d47d86b363824c718d9c165124cb55bbed12e0f9
          python - <<'PY'
          from pathlib import Path
          root=Path("companions/zog/src/zog").resolve()
          target=Path(".ci-deps/zog")
          target.mkdir(parents=True,exist_ok=True)
          for entry in root.iterdir():
              if entry.name in {"__init__.py","__pycache__","station_access","root_control","box_control"}:
                  continue
              if entry.is_dir() or (entry.is_file() and entry.suffix==".py"):
                  (target/entry.name).symlink_to(entry)
          assert (target/"image_build").is_dir()
          assert not (target/"__init__.py").exists()
          PY
      - name: Export exact selected backend read-only API envelope
        env:
          DJANGO_SETTINGS_MODULE: zog.station_access.project.settings
        run: |
          python -m pip install 'pytest>=8,<10' 'pytest-django>=4.11' 'Django>=5.2,<5.3' 'dbus-next==0.2.3'
          export PYTHONPATH="$PWD/companions/station-readiness/src:$PWD/companions/box-control/box-control/src:$PWD/companions/root-control/src:$PWD/.ci-deps:$PWD/tests"
          python tests/contracts/export_workspace_readiness.py "$PWD/.ci-contracts/workspace-readiness.json"
          # Pytest in the frontend review checkout can prepend an older
          # station-access src path; change rootdir to the selected producer.
          (
            cd companions/station-readiness
            PYTHONPATH="$GITHUB_WORKSPACE/companions/station-readiness/src:$GITHUB_WORKSPACE/companions/box-control/box-control/src:$GITHUB_WORKSPACE/companions/root-control/src:$GITHUB_WORKSPACE/.ci-deps:$GITHUB_WORKSPACE/companions/station-readiness/tests" \
              python -m pytest -q -rs tests/station_access/test_workspace_diagnostics.py
          )
          # The exact box/root producer source separately has its own green
          # producer CI; the new cross-language lane owns the API envelope.
      - run: npm ci --prefix frontend
      - name: Exercise real projected JSON in persistent viewer and grant suite
        working-directory: frontend
        env:
          ZOG_WORKSPACE_CONTRACT_JSON: ${{ github.workspace }}/.ci-contracts/workspace-readiness.json
        run: |
          npx vitest run src/vnc/BackendWorkspaceContract.test.tsx \
            src/vnc/ViewerReadinessIntegration.test.tsx \
            src/vnc/PersistentVncSessions.test.tsx \
            src/pages/WorkspaceReadinessPanel.test.tsx
          npx tsc --noEmit --project tsconfig.json
      - name: No real Desktop, grant or authority
        if: always()
        run: echo 'Exact backend source projected in memory; no VNC, X11, RFB, grant issuing, Host or production pins.' >> "$GITHUB_STEP_SUMMARY"
