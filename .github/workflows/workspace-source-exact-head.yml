# Candidate-only synthetic tests. Does NOT alter production companion pins.
name: First Workspace exact-head source contract

on:
  push:
    branches: [review/first-workspace-source-contract-20261031]
  pull_request:
    branches: [unstable]
    paths:
      - ".github/workflows/workspace-source-exact-head.yml"
      - "src/zog/station_access/services/vnc.py"
      - "src/zog/station_access/services/workspaces.py"
      - "src/zog/station_access/services/controller_workspaces.py"
      - "src/zog/station_access/api/views.py"
      - "tests/station_access/test_workspace_adapter.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head-workspace-source:
    # Secrets are never exposed to pull requests from forks.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      STATION_ACCESS_FRONTEND_DIRECTORY: ${{ github.workspace }}/frontend/dist
      BOX_HEAD: 8c2a24ae711bfc80b9ea5f69abda5c2619ca10f6
      ROOT_HEAD: 6e6ab97f1e8efabd736da7feb0a33410caff9909
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, node24
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, node24
        with:
          python-version: "3.12"

      - name: Require explicitly accepted immutable public companion pins
        id: pins
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          handoff = json.loads(Path("public-companion-pins.json").read_text())
          if (handoff.get("schema") != "zog-station-public-companion-pins-v1" or
                  handoff.get("status") != "accepted"):
              raise SystemExit("Public companion pins lack explicit source and compatibility acceptance")
          expected = {"zog144/host-identify":"host_identify","zog144/host-discover":"host_discover","zog144/host-install":"host_install","zog144/image-build":"image_build","zog144/box-control":"box_control","zog144/root-control":"root_control","zog144/archive-mirror":"archive_mirror","zog144/network-register":"network_register","zog144/host-deploy":"host_deploy","zog144/certify-manage":"certify_manage"}
          dependencies = handoff["dependencies"]
          if len(dependencies) != len(expected):
              raise SystemExit("Companion entries must be unique and complete")
          pinned = {item["repository"]: item["commit"] for item in dependencies}
          if set(pinned) != set(expected):
              raise SystemExit("Companion repositories differ from approved scope")
          for item in dependencies:
              if (item.get("rights_acceptance") != "accepted"
                  or item.get("consumer_acceptance") != "accepted"
                  or not re.fullmatch(r"[0-9a-f]{64}",
                                     item.get("acceptance_evidence_sha256") or "")):
                  raise SystemExit("Missing per-companion rights/consumer evidence for " + item["repository"])
          if set(pinned) != set(expected):
              raise SystemExit(f"Companion repository set differs: {sorted(set(pinned) ^ set(expected))}")
          if not all(re.fullmatch(r"[0-9a-f]{40}", sha) for sha in pinned.values()):
              raise SystemExit("Every companion pin must be a full immutable Git commit")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as outputs:
              for repository, label in expected.items():
                  print(f"{label}={pinned[repository]}", file=outputs)
          PY


      - name: Check out zog144/host-identify
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, node24
        with:
          repository: zog144/host-identify
          ref: ${{ steps.pins.outputs.host_identify }}
          path: dependencies/zog144/host-identify
          persist-credentials: false

      - name: Check out zog144/host-discover
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, node24
        with:
          repository: zog144/host-discover
          ref: ${{ steps.pins.outputs.host_discover }}
          path: dependencies/zog144/host-discover
          persist-credentials: false

      - name: Check out zog144/host-install
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, node24
        with:
          repository: zog144/host-install
          ref: ${{ steps.pins.outputs.host_install }}
          path: dependencies/zog144/host-install
          persist-credentials: false

      - name: Check out zog144/image-build
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, node24
        with:
          repository: zog144/image-build
          ref: ${{ steps.pins.outputs.image_build }}
          path: dependencies/zog144/image-build
          persist-credentials: false

      - name: Check out zog144/box-control
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, node24
        with:
          repository: zog144/box-control
          ref: 8c2a24ae711bfc80b9ea5f69abda5c2619ca10f6
          path: dependencies/zog144/box-control
          persist-credentials: false

      - name: Check out zog144/root-control
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, node24
        with:
          repository: zog144/root-control
          ref: 6e6ab97f1e8efabd736da7feb0a33410caff9909
          path: dependencies/zog144/root-control
          persist-credentials: false

      - name: Check out zog144/archive-mirror
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, node24
        with:
          repository: zog144/archive-mirror
          ref: ${{ steps.pins.outputs.archive_mirror }}
          path: dependencies/zog144/archive-mirror
          persist-credentials: false

      - name: Check out zog144/network-register
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, node24
        with:
          repository: zog144/network-register
          ref: ${{ steps.pins.outputs.network_register }}
          path: dependencies/zog144/network-register
          persist-credentials: false

      - name: Check out zog144/certify-manage
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, node24
        with:
          repository: zog144/certify-manage
          ref: ${{ steps.pins.outputs.certify_manage }}
          path: dependencies/zog144/certify-manage
          persist-credentials: false

      - name: Check out zog144/host-deploy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, node24
        with:
          repository: zog144/host-deploy
          ref: ${{ steps.pins.outputs.host_deploy }}
          path: dependencies/zog144/host-deploy
          persist-credentials: false

      - name: Prove exact station-access PR head and production manifest isolation
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python - <<'PY'
          import os, json
          from pathlib import Path
          data = json.loads(Path("public-companion-pins.json").read_text())
          assert data["schema"] == "zog-station-public-companion-pins-v1"
          assert data["status"] == "accepted"
          rows = {d["repository"]: d["commit"] for d in data["dependencies"]}
          assert rows["zog144/box-control"] != os.environ["BOX_HEAD"]
          assert rows["zog144/root-control"] != os.environ["ROOT_HEAD"]
          PY

      - name: Verify checked-out companion identities
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          handoff = json.loads(Path("public-companion-pins.json").read_text())
          for item in handoff["dependencies"]:
              name = item["repository"]
              path = Path("dependencies") / name
              observed = subprocess.check_output(["git", "-C", str(path), "rev-parse", "HEAD"], text=True).strip()
              expected = {
                  "zog144/box-control": "8c2a24ae711bfc80b9ea5f69abda5c2619ca10f6",
                  "zog144/root-control": "6e6ab97f1e8efabd736da7feb0a33410caff9909",
              }.get(name, item["commit"])
              if observed != expected:
                  raise SystemExit(f"Mismatch in {name}: expected {expected}, observed {observed}")
              print(f"{name}: {observed}")
          PY

      - name: Install pinned third-party and Zog components
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-security-tested.txt
          python -m pip install "dbus-next==0.2.3" "dnspython>=2.8,<3"
          python -m pip install --no-deps -e dependencies/zog144/host-identify
          python -m pip install --no-deps -e dependencies/zog144/host-discover
          python -m pip install --no-deps -e dependencies/zog144/host-install
          python -m pip install --no-deps -e dependencies/zog144/image-build
          python -m pip install --no-deps -e dependencies/zog144/box-control/box-control
          python -m pip install --no-deps -e dependencies/zog144/root-control
          python -m pip install --no-deps -e dependencies/zog144/archive-mirror
          python -m pip install --no-deps -e dependencies/zog144/network-register
          python -m pip install --no-deps -e dependencies/zog144/certify-manage
          python -m pip install --no-deps -e dependencies/zog144/host-deploy
          python -m pip install --no-deps -e .
          python -m pip check

      - name: Verify actual imported Zog components
        run: |
          python - <<'PY'
          import importlib
          from pathlib import Path

          root = (Path.cwd() / "dependencies" / "zog144").resolve()
          for component in ["host_identify","host_discover","host_install","image_build","box_control","root_control","archive_mirror","network_register","host_deploy","certify_manage"]:
              module = importlib.import_module("zog." + component)
              location = Path(module.__file__).resolve()
              if not location.is_relative_to(root):
                  raise SystemExit(f"Unexpected module location {component}: {location}")
              print(f"zog.{component}: {location}")
          PY

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5, node24
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend assets for Django response tests
        run: |
          npm install --global npm@11.9.0
          npm ci --prefix frontend
          npm run build --prefix frontend

      - name: Install required synthetic acceptance tooling
        run: python -m pip install "pytest>=8,<10" "jsonschema==4.25.1"

      - name: Test exact controller desktop binding and X11 mount/recovery
        run: |
          python -m pytest -q -ra --strict-markers --junitxml=workspace-box-results.xml \
            dependencies/zog144/box-control/box-control/tests/test_workspaces.py

      - name: Test root-control X11 cookie, protocol, namespace and RFB denials
        run: |
          python -m pytest -q -ra --strict-markers --junitxml=workspace-root-results.xml \
            dependencies/zog144/root-control/tests/test_workspace_backend.py

      - name: Test Django first Workspace and permanent noVNC denial/recovery
        run: python tools/test-backend.py tests.station_access.test_workspace_adapter

      - name: Require actual named controller and X11/RFB tests with no skips
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          expected = {
              "workspace-box-results.xml": (
                  "test_desktop_access_probes_exact_runtime_and_fails_closed",
                  "test_desktop_access_never_substitutes_other_workspace",
                  "test_first_workspace_shares_controller_x11_cookie_mounts_without_client_writes",
                  "test_first_workspace_client_readiness_failure_preserves_exact_desktop_binding",
              ),
              "workspace-root-results.xml": (
                  "test_owned_unix_endpoints_x11_cookie_and_namespace_identity",
                  "test_x11_protocol_fixture_requires_cookie_acceptance",
              ),
          }
          for path, names in expected.items():
              cases = list(ET.parse(path).iter("testcase"))
              if not cases or any(c.find(t) is not None for c in cases
                      for t in ("failure", "error", "skipped")):
                  raise SystemExit(f"Missing or failed/unrun Workspace source tests: {path}")
              for name in names:
                  if not any(name in c.attrib.get("name", "") for c in cases):
                      raise SystemExit(f"Required Workspace test missing: {name}")
              print(path, len(cases), "passed; no skips")
          PY

      - name: Emit explicit source-only evidence
        if: always()
        run: |
          {
            echo "## First Workspace exact-source contract"
            echo "- station-access source: $(git rev-parse HEAD)"
            echo "- box-control candidate: $BOX_HEAD"
            echo "- root-control candidate: $ROOT_HEAD"
            echo "- protected production public-companion-pins.json unchanged"
            echo "- no live Workspace, X11 server, TurboVNC, browser, systemd or Host acceptance"
          } >> "$GITHUB_STEP_SUMMARY"
