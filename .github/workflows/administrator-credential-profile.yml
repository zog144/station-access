name: Administrator credential profile

on:
  push:
    branches:
      - review/protected-https-credential-authority-20261029
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    name: Shared protocol profile (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out station-access candidate
        uses: actions/checkout@v4

      - name: Check out exact shared host-identify protocol
        uses: actions/checkout@v4
        with:
          repository: zog144/host-identify
          ref: 4a176373ff4cb47a66a8ab1b5fd3d6ff01ff2a3b
          path: dependencies/host-identify
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install focused source dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./dependencies/host-identify "Django>=5.2,<5.3" "pytest>=8,<10"
          python -m pip install --no-deps -e .

      - name: Verify exact shared protocol source
        run: |
          test "$(git -C dependencies/host-identify rev-parse HEAD)" = "4a176373ff4cb47a66a8ab1b5fd3d6ff01ff2a3b"
          python - <<'PY'
          import zog.host_identify
          import zog.host_identify.credential_delivery
          assert zog.host_identify.__version__ == "0.3.5"
          PY

      - name: Run source-only administrator profile integration
        run: python -m pytest -q tests/host_registry/test_administrator_credential_common_protocol.py
