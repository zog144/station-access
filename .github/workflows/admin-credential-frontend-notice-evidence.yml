name: Administrator credential frontend distribution source evidence
on:
  push:
    branches:
      - review/admin-credential-frontend-notice-evidence-20261103
  pull_request:
    paths:
      - frontend/scripts/distribution-evidence.mjs
      - frontend/scripts/distribution-evidence.node.mjs
      - frontend/scripts/release-plugin.mjs
      - .github/workflows/admin-credential-frontend-notice-evidence.yml
permissions:
  contents: read
jobs:
  exact-source-frontend-notices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Checkout exact host-discover provenance ledger, not accepted runtime
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: zog144/host-discover
          ref: 11376e09d7b9ff1251eca0549c2730406be1ca66
          path: dependencies/zog144/host-discover
          persist-credentials: false
      - name: Require exact receiver candidate ancestry and immutable provenance source
        run: |
          test "$(git -C dependencies/zog144/host-discover rev-parse HEAD)" = 11376e09d7b9ff1251eca0549c2730406be1ca66
          git merge-base --is-ancestor 7e8829483c1f2d49b2a4e7f2d97c6c2b9e364a73 HEAD
          git diff --exit-code 7e8829483c1f2d49b2a4e7f2d97c6c2b9e364a73 HEAD -- public-companion-pins.json
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact npm toolchain
        run: |
          npm install --global npm@11.9.0
          test "$(npm --version)" = 11.9.0
      - name: Build and test existing first-party frontend notice gate
        working-directory: frontend
        run: |
          npm ci
          npm run test:licenses
          npm run build
      - name: Verify emitted dist bytes and enforce missing-notice negatives
        working-directory: frontend
        run: |
          node --test scripts/distribution-evidence.node.mjs
          node scripts/distribution-evidence.mjs . --ledger ../dependencies/zog144/host-discover/verification/admin-credential-source-provenance-2026-11-02.json
      - name: Publish review-only inventory artifact (not a distributable release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: admin-credential-frontend-source-notice-evidence
          path: |
            frontend/dist/ADMIN-CREDENTIAL-FRONTEND-REVIEW.json
            frontend/dist/frontend-build.json
            frontend/dist/assets/LICENSES-*.txt
          retention-days: 7
          if-no-files-found: error
      - name: No rights/native promotion
        if: always()
        run: |
          echo 'Exact frontend artifact inventory only. Python wheels handled by host-discover PR #5.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No rights-holder permission, accepted production repin, Credential Authority or canonical STATE.' >> "$GITHUB_STEP_SUMMARY"
