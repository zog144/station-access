name: Canonical HTTPS credential v1 interoperability

on:
  push:
    branches: [review/unified-https-credential-interop-20261029, review/canonical-https-authority-ledger-20261030]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: zog144/host-identify
          ref: 4a176373ff4cb47a66a8ab1b5fd3d6ff01ff2a3b
          path: dependencies/host-identify
          persist-credentials: false
      - name: Check out accepted network-register source for protected station policy import
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: zog144/network-register
          ref: a271500f108af7db6dab2c8748af2f13f512f6e6
          path: dependencies/network-register
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install exact shared protocol source
        run: |
          test "$(git -C dependencies/host-identify rev-parse HEAD)" = "4a176373ff4cb47a66a8ab1b5fd3d6ff01ff2a3b"
          python -m pip install ./dependencies/host-identify 'pytest>=8,<10' 'pytest-django>=4.11' 'Django>=5.2,<5.3'
          test "$(git -C dependencies/network-register rev-parse HEAD)" = "a271500f108af7db6dab2c8748af2f13f512f6e6"
          python -m pip install --no-deps ./dependencies/network-register
          python -m pip install --no-deps -e .
      - name: Verify v1 public fixed vectors and transition state machine
        run: |
          python -m pytest -q verification/credential_v1/test_shared_interop.py
          python -m pytest -q verification/credential_v1/test_durable_server.py
          python -m pytest -q verification/credential_v1/test_authority_signer_approval.py
          python -m pytest -q dependencies/host-identify/tests/test_credential_delivery.py
      - name: Ensure legacy draft request cannot pass canonical validator
        run: |
          python - <<'PY'
          from zog.host_identify import credential_delivery as shared
          assert shared.REQUEST_SCHEMA == "zog-credential-request-v1"
          assert shared.DELIVERY_ENVELOPE_SCHEMA == "zog-credential-delivery-envelope-v1"
          assert shared.RECEIPT_SCHEMA == "zog-credential-installation-receipt-v1"
          assert shared.REQUEST_SCHEMA != "zog-credential-delivery-request-v1"
          assert shared.REQUEST_SCHEMA != "zog-protected-credential-delivery-v1"
          assert shared.REQUEST_SCHEMA != "zog-protected-credential-delivery-request-v1"
          PY
