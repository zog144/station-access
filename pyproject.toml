[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

# Component-development metadata only. Public Python publication is the
# aggregate "zog" distribution assembled by release-build.
[project]
name = "station-access"
version = "0.4.29"
description = "Zog station-access portal"
license = "BSD-3-Clause OR GPL-3.0-only"
license-files = ["LICENSE", "LICENSES/*.txt", "THIRD-PARTY-NOTICES.md"]
requires-python = ">=3.12"
dependencies = [
  "host-identify==0.3.5",
  "archive-mirror==0.4.2",
  "network-register[dns]==0.12.0",
  "Django>=5.2,<5.3",
  "waitress>=3,<4",
  "boto3>=1.34,<2",
]

[project.optional-dependencies]
deployments = ["host-deploy==0.10.6"]
controller = ["box-control==0.1.0"]
test = ["pytest>=8.4", "pytest-django>=4.11"]

[project.scripts]
station-access = "zog.station_access.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["zog.station_access*"]
namespaces = true

[tool.setuptools.package-data]
"zog.station_access.host_registry" = ["fixtures/*.json"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "zog.station_access.project.settings"
pythonpath = ["src", "."]
testpaths = ["tests"]
